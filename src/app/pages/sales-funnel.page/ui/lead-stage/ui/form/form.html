<div
  class="ml-1 border-2 rounded-full size-5 cursor-pointer bg-transparent hover:bg-white/10"
></div>
<input
  #input
  (keyup.enter)="onSave()"
  (keyup.escape)="closeForm($event)"
  [formControl]="field"
  class="flex-1 edit_name_input"
  type="text"
/>
<svg (click)="onSave()" class="size-4 opacity-50 hover:opacity-100" icon="documents" />
<svg (click)="closeForm($event)" class="size-4 opacity-50 hover:opacity-100" icon="x" />
