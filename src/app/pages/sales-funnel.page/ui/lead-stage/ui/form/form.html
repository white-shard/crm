<select-color
  [colors]="colors"
  [defaultValue]="color()"
  (onSelect)="color.set($event)"
  (onClosed)="focus()"
/>
<input
  #input
  tabindex="2"
  (keyup.enter)="onSave()"
  [formControl]="field"
  class="flex-1 edit_name_input"
  type="text"
/>
<svg
  tabindex="2"
  (click)="onSave()"
  (keyup.enter)="onSave()"
  class="size-4 opacity-50 hover:opacity-100"
  icon="documents"
/>
<svg
  tabindex="2"
  (click)="closeForm($event)"
  (keyup.enter)="closeForm($event)"
  class="size-4 opacity-50 hover:opacity-100"
  icon="x"
/>
