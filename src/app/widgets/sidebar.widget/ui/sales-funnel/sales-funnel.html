<div class="flex items-center justify-between p-4">
  <h1 class="text-xl font-bold text-text-background">Воронки</h1>
  <button
    (click)="showForm()"
    class="border border-accent text-accent rounded-base px-2 py-1 text-sm flex gap-2 items-center hover:bg-accent/10 hover:cursor-pointer"
  >
    <svg class="size-3" icon="plus" />
    добавить
  </button>
</div>

@if (funnelList.isFetching()) {
  @for (item of [].constructor(funnelList.data()?.length ?? 3); track $index) {
    <div
      class="w-full px-4 py-4 items-center grid gap-2 grid-cols-[24px_1fr] not-last:border-b border-text-background/20 hover:cursor-pointer hover:bg-primary/10"
    >
      <svg class="text-text-background size-6 animate-pulse" icon="funnel" />
      <div class="bg-text-background/20 animate-pulse h-6 w-full rounded-full"></div>
    </div>
  }
} @else if (funnelList.isSuccess()) {
  @for (item of funnelList.data(); track item.id) {
    <div
      (click)="goToFunnel(item.id)"
      class="w-full px-4 py-4 items-center grid gap-2 grid-cols-[24px_1fr_56px] not-last:border-b border-text-background/20 hover:cursor-pointer hover:bg-primary/10"
    >
      <svg class="size-6" icon="funnel" />
      <span class="overflow-hidden">{{ item.displayName }}</span>
      <div class="flex gap-2 justify-end">
        <svg (click)="updateForm(item)" class="size-4 hover:text-accent" icon="edit" />
        <svg class="size-4 hover:text-red-500" icon="trash" />
      </div>
    </div>
  }
}
