<div class="sidebar">
  <div class="w-full mb-4">
    <img class="size-12 mx-auto my-auto" alt="ShardCRM" src="/favicon.svg" />
  </div>

  <div class="flex-1 w-full select-none">
    @for (item of menu; track item.label) {
      <div
        (click)="onSidebarMenuItemClick(item)"
        class="flex flex-col gap-1 w-full py-4 justify-center items-center hover:cursor-pointer hover:bg-accent/10"
      >
        <svg class="size-6" [icon]="item.icon" />
        <span class="text-xs">{{ item.label }}</span>
      </div>
    }
  </div>

  <div class="w-full">
    <div class="flex flex-col gap-1 w-full py-4 justify-center items-center hover:bg-accent/10">
      <svg class="size-6" icon="gear" />
      <span class="text-xs">Настройки</span>
    </div>
  </div>
</div>

@if (!!submenu() && submenu().length) {
  <div class="submenu shadow-lg">
    @for (item of submenu(); track item.label) {
      <div
        (click)="onSidebarSubmenuItemClick(item)"
        class="w-full px-4 py-4 items-center grid gap-2 grid-cols-[24px_1fr] not-last:border-b border-text-background/20 hover:cursor-pointer hover:bg-primary/10"
      >
        <svg class="size-6" [icon]="item.icon" />
        {{ item.label }}
      </div>
    }
  </div>
}

@if (!!component()) {
  <div class="submenu shadow-lg">
    <ng-container [ngComponentOutlet]="component()"></ng-container>
  </div>
}
