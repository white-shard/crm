<div
  (click)="goToTheFunnelPage()"
  class="w-full px-4 py-4 items-center grid gap-2 grid-cols-[24px_1fr_56px] not-last:border-b border-text-background/20 hover:cursor-pointer hover:bg-primary/10"
>
  <svg class="size-6" icon="funnel" />
  <span class="overflow-hidden">{{ data().displayName }}</span>
  <div class="flex gap-2 justify-end">
    <svg (click)="selectForUpdate($event)" class="size-4 hover:text-accent" icon="edit" />
    <svg (click)="remove($event)" class="size-4 hover:text-red-500" icon="trash" />
  </div>
</div>
